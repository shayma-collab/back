# ======= Configuration serveur =======
server.port=8080

# ======= Configuration upload fichiers =======
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# ======= Configuration datasource MySQL =======
spring.datasource.url=jdbc:mysql://localhost:3307/projet_stage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======= Configuration JPA / Hibernate =======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======= Debug =======
debug=true
